# Course grid fitted to the walls of rb3302_map.pgm (2026-11-05), once.
#
# 1. Grid: origin (SW inner corner), yaw and square size per axis fitted by
#    robust least squares so the map's 697 wall cells lie on the course's
#    grid lines (median wall-to-line error 2.8 -> 2.4 cm). Squares come out
#    0.601 m (E-W) x 0.595 m (N-S).
# 2. Targets: each square centre on that grid, then moved to halfway
#    between its two walls on any axis with walls on both sides (at most
#    8 cm; largest: K 7.0 cm, J 3.7 cm, W 2.7 cm). Axes with an open side
#    keep the grid centre.
# 3. 2026-11-05: everything (grid origin and all targets) shifted 5 cm
#    west by hand after a run showed the robot stopping too far east.
#
# go_letters drives to `targets` (map frame, m) and uses arena_yaw for the
# start bearing; planning.launch.py publishes map->arena from arena_x/y/yaw
# (for RViz). Tied to this map: refit if the map is rebuilt or edited.
arena_x: 0.3905
arena_y: 1.6590
arena_yaw: -2.0320
cell_x: 0.6009
cell_y: 0.5951
