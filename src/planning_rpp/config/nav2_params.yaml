amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    # Motion noise. Heading comes from the gyro, which is accurate, so the
    # rotation terms stay small. Wheel distance is not: pushing against a
    # wall the wheels slip and the encoders report full motion while the
    # robot stands still, so translation noise is large -- the particles
    # then also cover "did not really move" and the scan can pick it.
    alpha1: 0.2    # rotation noise from rotation
    alpha2: 0.2    # rotation noise from translation
    alpha3: 0.6    # translation noise from translation (wheel slip)
    alpha4: 0.3    # translation noise from rotation
    alpha5: 0.2
    # Laser model: sharp enough for a 4 m arena of 60 cm squares (defaults
    # sigma_hit 0.2 / z_hit 0.5 / z_rand 0.5 / 60 beams accept scans that
    # are ~20 cm off the walls and barely pull the pose back).
    laser_model_type: likelihood_field
    sigma_hit: 0.08
    z_hit: 0.9
    z_rand: 0.1
    max_beams: 120
    # Tuned on the robot: a large particle pool for the loose start pose
    # (+-0.15 m, +-45 deg) and frequent scan corrections (every 5 cm / ~6 deg)
    # for the tight goal tolerance.
    # Reduced from 2000/3000 to ease CPU load on the robot.
    min_particles: 1500
    max_particles: 2500
    update_min_d: 0.05
    update_min_a: 0.1

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    # Fallback: if the robot moves less than 0.15 m in 5 s, the controller
    # gives up and Nav2 runs its recovery behaviours (clear costmaps, spin,
    # back up, replan). Was the default 0.5 m in 10 s. A pivot alone does not
    # count as progress, but pivots take <4 s at the calibrated turn rate.
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 5.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # A 0.31 m robot stays fully inside a 0.6 m square up to ~0.145 m off
      # centre. 0.05 m is about as tight as AMCL's ~2-3 cm pose noise allows;
      # tighter makes the robot creep/oscillate at the goal.
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.14   # heading at squares does not matter
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.2
      # Short lookahead: RPP steers at a point this far along the path, so a
      # long one cuts the inside of corners (~0.3 x lookahead on a 90 deg
      # corner: 0.25 -> ~7 cm, 0.18 -> ~5 cm). Too short amplifies AMCL
      # jitter into steering (turn command ~ error / lookahead^2), so raise
      # it again (0.20-0.22) if the robot weaves on straights.
      lookahead_dist: 0.18
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      # Requested pivot rate (turn_rate_controller converts it for the base).
      # 0.6 rather than 1.0: the base keeps turning ~0.45 s after a command
      # drops, so a faster pivot overshoots further (2026-10-29 recording).
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Never slow down near walls: they are avoided by planning down the
      # centre (Smac 2D), tracking that path, and wall_repulsion steering.
      use_cost_regulated_linear_velocity_scaling: false
      # Slow down on bends tighter than this radius (corners), so turns are
      # tracked closely instead of swinging wide.
      regulated_linear_scaling_min_radius: 0.6
      # Floor for all of RPP's slowdowns: below ~0.1 m/s the skid-steer base
      # may not move at all. Raise if it still stalls near walls.
      regulated_linear_scaling_min_speed: 0.12
      allow_reversing: false
      use_rotate_to_heading: true
      # Skid-steer pivots far better than it curves: turn on the spot to
      # face the path whenever it is more than ~29 deg off.
      rotate_to_heading_min_angle: 0.5
      # RPP ramps pivot commands from the MEASURED turn rate, at most
      # max_angular_accel * 0.05 s per cycle. At 3.2 a stationary robot was
      # asked for 0.16 rad/s, which the base cannot pivot at, so it stayed
      # stationary for 15-40 s (0903 recording). 20 lets the first pivot
      # command reach the full rate; the velocity smoother still ramps it.
      max_angular_accel: 20.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real robot: 20 x 20 cm, turning about its centre (measured
      # 2026-10-29; the earlier 30 x 31 cm came from the URDF estimate).
      footprint: "[[0.10, 0.10], [0.10, -0.10], [-0.10, -0.10], [-0.10, 0.10]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Course corridors are ~0.6 m wide, so a centred robot is ~0.3 m from
        # each wall. Cost starts at the footprint edge (0.10 m) and fades out
        # by 0.35 m, so planned paths are pushed to the middle of corridors.
        inflation_radius: 0.35
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Real robot: 20 x 20 cm, turning about its centre (measured
      # 2026-10-29; the earlier 30 x 31 cm came from the URDF estimate).
      footprint: "[[0.10, 0.10], [0.10, -0.10], [-0.10, -0.10], [-0.10, 0.10]]"
      # Planning only: the planner checks the robot as a circle the size of
      # its half-width (0.10 m), but its corners reach 0.141 m. A 5 cm pad
      # keeps planned paths at least 0.15 m (centre) from walls, so an
      # angled robot's corners clear them. The local costmap (RPP's
      # collision check) is unpadded.
      footprint_padding: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Course corridors are ~0.6 m wide, so a centred robot is ~0.3 m from
        # each wall. Cost starts at the footprint edge (0.10 m) and fades out
        # by 0.35 m, so planned paths are pushed to the middle of corridors.
        inflation_radius: 0.35
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # Smac 2D: A* on the costmap grid, like NavFn, but it weighs the
    # inflation cost much more strongly, so paths run down the middle of the
    # corridors instead of cutting close to walls. The robot is then kept
    # off walls by following the path, not by slowing down.
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # How hard paths avoid high-cost cells near walls. 1.0 = barely,
      # 2.0 = Nav2's suggested trade-off. 8 keeps paths in the middle of
      # corridors and through turns (simulated on rb3302_map: worst corner
      # gap on I->N / N->F 0 cm -> 7.6 cm together with the global
      # footprint_padding and go_letters' target nudge). The map is tiny, so
      # the extra search time does not matter.
      cost_travel_multiplier: 8.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    # Skid-steer needs a quick, strong angular command to break wheel friction
    # (keyboard teleop turns at 1.5 rad/s instantly).
    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [-0.5, 0.0, -2.0]
    max_accel: [0.5, 0.0, 3.0]
    max_decel: [-0.5, 0.0, -3.0]
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 3500

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    # velocity_smoother -> collision_monitor -> wall_repulsion -> turn controller
    cmd_vel_in_topic: cmd_vel_nav_smoothed
    cmd_vel_out_topic: cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    # No slow-down zones: walls are handled by steering (centred path,
    # wall_repulsion). This is only a last-resort stop if something is about
    # to touch the front of the robot (within 4 cm ahead). It zeroes the
    # whole command, so the stall boost never pushes into a wall.
    polygons: ["EmergencyStop"]
    EmergencyStop:
      type: polygon
      action_type: stop
      points: "[[0.14, 0.10], [0.14, -0.10], [0.10, -0.10], [0.10, 0.10]]"
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      enabled: true
